# CI uses the latest stable; the workspace MSRV is rust-version in Cargo.toml.
# Release targets (x86_64/aarch64-unknown-linux-musl) are added by the workflows.
# No `components`/`profile`: the cargo fallback of shell/fetch.zsh must build offline with
# whatever stable toolchain the user has; CI installs rustfmt and clippy itself.
[toolchain]
channel = "stable"
