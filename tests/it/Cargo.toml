[package]
name = "cinelog-it"
description = "cinelog integration tests (real zsh, tmux, PTY); see tests/it/README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The harness talks to cinelog only through the built binary, the plugin, the casts and the
# registry files, exactly as a user would. It deliberately does not link the cinelog crates.

[features]
# Scenarios that need root or a real sudo prompt also require CINELOG_IT_ROOT=1 at runtime.
root = []

[dependencies]
nix.workspace = true
libc.workspace = true
serde_json.workspace = true
regex.workspace = true
tempfile.workspace = true
getrandom.workspace = true
anyhow.workspace = true

[lints]
workspace = true
